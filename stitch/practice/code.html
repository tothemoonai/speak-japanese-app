<!DOCTYPE html>

<html class="dark" lang="ja"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>IT Japanese - Practice Page</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Manrope:wght@300;400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-high": "#222a3d",
                        "on-tertiary": "#472a00",
                        "surface": "#0b1326",
                        "on-tertiary-fixed-variant": "#653e00",
                        "primary-fixed": "#62fae3",
                        "tertiary-container": "#ffad3a",
                        "secondary-container": "#39485a",
                        "error-container": "#93000a",
                        "surface-dim": "#0b1326",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed-dim": "#b9c8de",
                        "on-surface-variant": "#bacac5",
                        "primary": "#57f1db",
                        "inverse-on-surface": "#283044",
                        "surface-container-highest": "#2d3449",
                        "on-primary": "#003731",
                        "surface-container-low": "#131b2e",
                        "surface-container": "#171f33",
                        "surface-bright": "#31394d",
                        "tertiary-fixed": "#ffddb8",
                        "primary-fixed-dim": "#3cddc7",
                        "on-primary-fixed-variant": "#005047",
                        "tertiary": "#ffd29f",
                        "secondary": "#b9c8de",
                        "on-primary-container": "#00574d",
                        "on-secondary-fixed": "#0d1c2d",
                        "on-background": "#dae2fd",
                        "outline-variant": "#3c4a46",
                        "inverse-surface": "#dae2fd",
                        "on-primary-fixed": "#00201c",
                        "on-secondary-fixed-variant": "#39485a",
                        "on-tertiary-fixed": "#2a1700",
                        "on-secondary": "#233143",
                        "primary-container": "#2dd4bf",
                        "outline": "#859490",
                        "secondary-fixed": "#d4e4fa",
                        "tertiary-fixed-dim": "#ffb95f",
                        "on-tertiary-container": "#6d4400",
                        "on-error": "#690005",
                        "inverse-primary": "#006b5f",
                        "surface-tint": "#3cddc7",
                        "surface-container-lowest": "#060e20",
                        "on-surface": "#dae2fd",
                        "on-secondary-container": "#a7b6cc",
                        "surface-variant": "#2d3449",
                        "background": "#0b1326",
                        "error": "#ffb4ab"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Manrope"],
                        "label": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
                },
            },
        }
    </script>
<style>
        .ruby-top { ruby-position: over; }
        .recording-pulse {
            position: relative;
        }
        .recording-pulse::before, .recording-pulse::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 9999px;
            background: #57f1db;
            opacity: 0.2;
            z-index: -1;
        }
    </style>
<style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col selection:bg-primary/30">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-gradient-to-b from-[#161f35] to-[#0b1326] flex justify-between items-center px-6 py-4">
<div class="flex items-center gap-4">
<button class="text-[#b9c8de] active:scale-95 duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex flex-col">
<h1 class="font-headline font-bold tracking-tight text-teal-400 text-lg">朝礼</h1>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[14px] text-on-surface-variant">format_list_bulleted</span>
<span class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant">シナリオ練習</span>
</div>
</div>
</div>
<div class="h-10 w-10 rounded-full overflow-hidden ring-2 ring-primary/20">
<img alt="User Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB7Qb1MxXYwKTNIRqCx5Yvruq4oqxldL9Cbe5IkYljy4i-AbRr6hFJmRvZjRJ7ONIGtu4FOrlDhT6MEx2OHh2itSayIa3wuZqZ_DcFoFmNO0sHM0Tmo7z7T-RtimqdpmSqGF5zmR-a9IJNi9QPuTNscrxV-sSe1GlczK_TJ3E0eiQ8iLoeb3wGBHdnIxvDNDBa05UIvhb7PIIPfChAA7BQPP0hA5AD9_yGCLzDdUp_W9aFJ2hm55Aum8-MtMKGukCKaXYgaLB3i1VI"/>
</div>
</header>
<main class="flex-1 flex flex-col px-6 pt-4 pb-32 max-w-2xl mx-auto w-full">
<!-- Progress Section -->
<section class="mb-8">
<div class="flex justify-between items-end mb-3">
<span class="font-label text-xs font-semibold text-primary uppercase tracking-widest">例文 3/10</span>
<span class="font-headline font-bold text-surface-bright text-xl opacity-40">30%</span>
</div>
<div class="h-1 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary w-[30%] shadow-[0_0_8px_rgba(87,241,219,0.5)]"></div>
</div>
</section>
<!-- Character Selector -->
<section class="flex gap-3 mb-10">
<button class="flex-1 py-3 px-4 rounded-xl bg-primary/10 border border-primary/20 flex items-center justify-center gap-2 group transition-all">
<div class="w-2 h-2 rounded-full bg-primary shadow-[0_0_6px_rgba(87,241,219,0.8)]"></div>
<span class="font-label font-bold text-primary text-sm">田中さん</span>
</button>
<button class="flex-1 py-3 px-4 rounded-xl bg-surface-container-low border border-transparent hover:bg-surface-container-high transition-all flex items-center justify-center gap-2 opacity-60">
<div class="w-2 h-2 rounded-full bg-secondary"></div>
<span class="font-label font-medium text-secondary text-sm">鈴木さん</span>
</button>
</section>
<!-- Sentence Content Card -->
<section class="mb-8 relative group">
<div class="bg-surface-container-low p-8 rounded-full rounded-tr-none relative overflow-hidden">
<div class="absolute top-0 right-0 p-4">
<button class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary hover:bg-primary hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
</div>
<div class="pr-12">
<div class="mb-6">
<ruby class="text-3xl md:text-4xl font-light leading-relaxed tracking-wide text-on-surface ruby-top">
                        今日<rt class="text-xs text-primary/60 font-medium">きょう</rt>
</ruby>
<span class="text-3xl md:text-4xl font-light leading-relaxed tracking-wide text-on-surface">の</span>
<ruby class="text-3xl md:text-4xl font-light leading-relaxed tracking-wide text-on-surface ruby-top">
                        進捗<rt class="text-xs text-primary/60 font-medium">しんちょく</rt>
</ruby>
<span class="text-3xl md:text-4xl font-light leading-relaxed tracking-wide text-on-surface">を</span>
<ruby class="text-3xl md:text-4xl font-light leading-relaxed tracking-wide text-on-surface ruby-top">
                        報告<rt class="text-xs text-primary/60 font-medium">ほうこく</rt>
</ruby>
<span class="text-3xl md:text-4xl font-light leading-relaxed tracking-wide text-on-surface">します。</span>
</div>
<p class="text-on-surface-variant font-body text-base border-l-2 border-outline-variant pl-4">
                    我来报告一下今天的进展。
                </p>
</div>
</div>
</section>
<!-- Evaluation Card (S Grade) -->
<section class="mb-12 animate-in fade-in slide-in-from-bottom-4 duration-700">
<div class="bg-gradient-to-br from-tertiary-container/20 to-surface-container-high p-6 rounded-full overflow-hidden border border-tertiary/10">
<div class="flex items-center justify-between gap-6">
<div class="flex flex-col items-center">
<div class="text-5xl font-headline font-extrabold text-tertiary tracking-tighter mb-1">S</div>
<span class="font-label text-[10px] uppercase tracking-widest text-tertiary/60">ランク</span>
</div>
<div class="flex-1 grid grid-cols-2 gap-y-3 gap-x-6 border-l border-white/5 pl-6">
<div>
<p class="font-label text-[10px] text-on-surface-variant uppercase tracking-widest">スコア</p>
<p class="font-headline font-bold text-xl text-on-surface">98</p>
</div>
<div>
<p class="font-label text-[10px] text-on-surface-variant uppercase tracking-widest">正確さ</p>
<p class="font-headline font-bold text-xl text-primary">98%</p>
</div>
<div>
<p class="font-label text-[10px] text-on-surface-variant uppercase tracking-widest">発音</p>
<p class="font-headline font-bold text-xl text-secondary">95%</p>
</div>
<div>
<p class="font-label text-[10px] text-on-surface-variant uppercase tracking-widest">流暢さ</p>
<p class="font-headline font-bold text-xl text-primary">99%</p>
</div>
</div>
</div>
</div>
</section>
<!-- Recording Section -->
<section class="flex flex-col items-center justify-center gap-6 mt-auto">
<div class="flex flex-col items-center gap-2">
<span class="font-label text-xs uppercase tracking-[0.2em] text-primary animate-pulse">録音中...</span>
<div class="flex gap-1">
<div class="w-1 h-3 bg-primary/40 rounded-full"></div>
<div class="w-1 h-5 bg-primary/60 rounded-full"></div>
<div class="w-1 h-8 bg-primary rounded-full"></div>
<div class="w-1 h-4 bg-primary/60 rounded-full"></div>
<div class="w-1 h-6 bg-primary/40 rounded-full"></div>
</div>
</div>
<button class="recording-pulse w-24 h-24 rounded-full bg-primary-container flex items-center justify-center shadow-[0_0_40px_rgba(87,241,219,0.3)] active:scale-90 transition-transform">
<span class="font-label font-bold text-on-primary-container tracking-widest text-sm">録音</span>
</button>
</section>
</main>
<!-- Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-10 pb-10 pt-4 pointer-events-none">
<div class="flex flex-col items-center gap-1 pointer-events-auto group">
<button class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-secondary group-hover:text-primary transition-colors active:scale-95">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<span class="text-[10px] text-on-surface-variant font-label uppercase tracking-widest">戻る</span>
</div>
<div class="flex flex-col items-center gap-1 pointer-events-auto group">
<button class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-secondary group-hover:text-primary transition-colors active:scale-95">
<span class="material-symbols-outlined">chevron_right</span>
</button>
<span class="text-[10px] text-on-surface-variant font-label uppercase tracking-widest">次へ</span>
</div>
</nav>
</body></html>
